<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Weather App</title>
  <link rel="stylesheet" href="output.css" />
</head>
<body class="bg-gradient-to-br from-blue-100 to-blue-300 min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="w-full max-w-md sm:max-w-lg bg-white p-6 sm:p-8 rounded-lg shadow-lg">
    <h1 class="text-2xl sm:text-3xl font-bold text-center text-blue-800 mb-6">
      🌤️ Weather Forecast
    </h1>

    <!-- Search Form -->
    <div class="mb-4 space-y-2">
      <input
        type="text"
        id="cityInput"
        class="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="Enter city name"
      />
      <button
        id="searchBtn"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 rounded-md transition"
      >
        🔍 Search Weather
      </button>
    </div>

    <!-- Current Location -->
    <button
      id="currentLocationBtn"
      class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 rounded-md transition mb-4"
    >
      📍 Use Current Location
    </button>

  
    <!-- Recent Searches -->
    <div id="recentSearchesContainer" class="mt-6 hidden">
      <h3 class="text-lg font-bold text-blue-700 mb-2">🕒 Recent Searches</h3>
      <select
        id="recentSearchesDropdown"
        class="w-full p-2 border border-gray-300 rounded-md"
      ></select>
    </div>

    <!-- Error Message -->
    <div
      id="errorMessage"
      class="text-red-600 text-center font-medium mt-2 hidden"
    ></div>

    <!-- Weather Info -->
    <div
      id="weatherData"
      class="mt-6 hidden text-center space-y-2 bg-blue-50 p-4 rounded-md"
    >
      <h2 id="locationName" class="text-xl font-bold text-blue-700"></h2>
      <img
        id="weatherIcon"
        class="w-16 h-16 mx-auto"
        alt="Weather Icon"
      />
      <p id="temperature" class="text-lg font-semibold text-gray-800"></p>
      <p id="humidity" class="text-gray-600"></p>
      <p id="windSpeed" class="text-gray-600"></p>
    </div>

    <!-- 5-Day Forecast -->
    <div id="extendedForecast" class="mt-6 hidden">
      <h3 class="text-lg font-bold text-blue-700 mb-2 text-center">📅 5-Day Forecast</h3>
      <div
        id="forecastList"
        class="grid grid-cols-2 sm:grid-cols-3 gap-4 text-sm"
      ></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
